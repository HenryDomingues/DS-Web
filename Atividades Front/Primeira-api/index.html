<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>API</title>
</head>
<body>
    <h1>Minha Primeira API</h1>
    <div class="container">
        <h3>Testando requisições HTTP para a nossa Primeira API</h3>
        <hr>
        <h4>Endpoint ➡️ /localhost/primeira-api/hello</h4>
        <h4>Método Get6️⃣</h4>
        <button id="btn-hello">Testar Endpoint</button>
        <hr>

        <h4>Endpoint ➡️ /localhost/primeira-api/echo</h4>
        <h4>Método Post7️⃣</h4>
        <input type="text" id="input-echo" placeholder="Digite algo para o Echo">
        <button id="btn-echo">Testar Endpoint</button>
        <hr>

        <h4>Resposta da requisição:</h4>
        <div id="resposta" class="resposta">
        </div>
    </div>
</body>
<script src="script.js"></script>
</html>
