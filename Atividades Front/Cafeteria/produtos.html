<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>Produtos</title>
</head>
<body>
    <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="pedidos.html">Pedidos</a></li>
        <li><a href="produtos.html">Produtos</a></li>
        <li><a href="categorias.html">Categorias</a></li>
        <li><a href="#about">Sobre</a></li>
    </ul>

    <div class="formulario">
        <h3>Cadastro de Produtos</h3>
        <label for="nome">Nome do Produto</label>
        <input type="text" id="nome" name="nome">

        <label for="preco">Preço do Produto</label>
        <input type="text" id="preco" name="preco">

        <label for="categoria_id">Categoria do Produto</label>
        <select name="categoria_id" id="categoria_id">
            <option value="">Selecione uma categoria</option>
            <option value="1">Doce</option>
            <option value="2">Salgado</option>
            <option value="3">Bebida</option>
        </select>

        <label for="disponivel">Disponibilidade do Produto</label>
        <select name="disponivel" id="disponivel">
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>

        </select>

        <button type="button" id="botaoEnviar" class="button button-enviar">Cadastrar</button>
    </div>

   

    <div id="resposta" class="tabela">
       
    </div>
</body>
<script src="./assets/js/produtos.js"></script>
</html>
